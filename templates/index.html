<!DOCTYPE html>
<html>
<head>
    <title>ScanX</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">
    <h1>ScanX</h1>
    <p class="subtitle">Web Vulnerability Scanner</p>

    <form method="POST">
        <input type="text" name="url" placeholder="Enter website URL" required>
        <button type="submit">Scan</button>
    </form>

    {% if results %}
    <div class="results">
        <h2>Results</h2>

        {% for result in results %}
        <div class="card {{ result.status.lower() }}">
            <h3>{{ result.name }}</h3>
            <p><strong>Status:</strong> {{ result.status }}</p>
            <p>{{ result.message }}</p>
        </div>
        {% endfor %}

    </div>
    {% endif %}
</div>

</body>
</html>
